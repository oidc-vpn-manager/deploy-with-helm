{{- if and .Values.frontend.enabled .Values.frontend.combinedService.enabled (not (or .Values.frontend.userService.enabled .Values.frontend.adminService.enabled)) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oidc-vpn-manager.frontend.fullname" . }}
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "oidc-vpn-manager.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
{{- end }}

{{- if and .Values.frontend.enabled .Values.frontend.userService.enabled }}
apiVersion: v1
kind: Service
