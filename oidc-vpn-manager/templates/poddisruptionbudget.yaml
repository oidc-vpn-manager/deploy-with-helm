{{- if .Values.podDisruptionBudget.enabled }}
{{- if .Values.frontend.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oidc-vpn-manager.frontend.fullname" . }}
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oidc-vpn-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
---
{{- end }}
{{- if .Values.signing.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oidc-vpn-manager.signing.fullname" . }}
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: signing
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oidc-vpn-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: signing
---
{{- end }}
{{- if .Values.certtransparency.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "oidc-vpn-manager.certtransparency.fullname" . }}
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: certtransparency
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oidc-vpn-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: certtransparency
---
{{- end }}
{{- end }}