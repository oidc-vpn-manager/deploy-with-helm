    - {{ include "oidc-vpn-manager.frontend.fullname" . }}-user.{{ .Release.Namespace }}.svc
    - {{ include "oidc-vpn-manager.frontend.fullname" . }}-user.{{ .Release.Namespace }}.svc.cluster.local
{{- end }}

