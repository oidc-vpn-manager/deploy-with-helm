{{- if and .Values.applicationTls.enabled .Values.applicationTls.certManager.enabled }}

{{- if and .Values.frontend.enabled .Values.frontend.combinedService.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "oidc-vpn-manager.frontend.fullname" . }}-app-tls
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  secretName: {{ include "oidc-vpn-manager.frontend.fullname" . }}-app-tls
  issuerRef:
    name: {{ .Values.applicationTls.certManager.issuerRef.name }}
    kind: {{ .Values.applicationTls.certManager.issuerRef.kind | default "ClusterIssuer" }}
  dnsNames:
    - {{ include "oidc-vpn-manager.frontend.fullname" . }}
    - {{ include "oidc-vpn-manager.frontend.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "oidc-vpn-manager.frontend.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
{{- end }}

{{- if and .Values.frontend.enabled .Values.frontend.userService.enabled }}
---
apiVersion: cert-manager.io/v1
