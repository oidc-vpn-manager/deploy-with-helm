# Default values for postgresql
replicaCount: 1

image:
  repository: postgres
  pullPolicy: IfNotPresent
  tag: "17-alpine"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 999
  runAsUser: 999

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 999

service:
  type: ClusterIP
  port: 5432

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL configuration
auth:
  postgresPassword: "test123"
  username: "postgres"
  password: "test123"
  database: "openvpn_manager_test"

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

initdb:
  scripts: {}
