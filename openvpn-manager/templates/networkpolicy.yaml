{{- if .Values.networkPolicy.enabled }}
# Allow frontend to communicate with signing service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oidc-vpn-manager.fullname" . }}-frontend-to-signing
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oidc-vpn-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: signing
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "oidc-vpn-manager.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: frontend
    ports:
    - protocol: TCP
      port: {{ .Values.signing.service.port }}
---
# Allow signing service to communicate with certtransparency
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oidc-vpn-manager.fullname" . }}-signing-to-ct
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oidc-vpn-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: certtransparency
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "oidc-vpn-manager.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: signing
    ports:
    - protocol: TCP
      port: {{ .Values.certtransparency.service.port }}
---
# Allow frontend to communicate with certtransparency (for admin interface)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oidc-vpn-manager.fullname" . }}-frontend-to-ct
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oidc-vpn-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: certtransparency
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "oidc-vpn-manager.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: frontend
    ports:
    - protocol: TCP
      port: {{ .Values.certtransparency.service.port }}
---
# Allow ingress traffic to frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oidc-vpn-manager.fullname" . }}-allow-ingress
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oidc-vpn-manager.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - {}  # Allow all ingress traffic (controlled by ingress controller)
---
# Allow all services to access PostgreSQL
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oidc-vpn-manager.fullname" . }}-to-postgresql
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "oidc-vpn-manager.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 5432
{{- end }}
---
# Egress policy - allow DNS and external OIDC
{{- if .Values.networkPolicy.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "oidc-vpn-manager.fullname" . }}-egress
  labels:
    {{- include "oidc-vpn-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "oidc-vpn-manager.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Egress
  egress:
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTP(S) to external OIDC provider
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 80
  # Allow inter-service communication within namespace
  - to:
    - podSelector:
        matchLabels:
          {{- include "oidc-vpn-manager.selectorLabels" . | nindent 10 }}
  # Allow access to database servers
  - to: []
    ports:
    - protocol: TCP
      port: {{ .Values.frontend.config.database.port }}
    - protocol: TCP
      port: {{ .Values.certtransparency.config.database.port }}
{{- end }}
{{- end }}